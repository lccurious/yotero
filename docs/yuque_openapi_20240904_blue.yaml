  /api/v2/videos/info:
    get:
      tags:
        - doc
      summary: 获取音频/视频播放地址
      operationId: doc_api_v2_video_show
      description: |-
        获取音频/视频播放地址
        GET /api/v2/videos/info


        - 要求有文档编辑权限
      parameters:
        - name: video_id
          in: query
          description: >-
            videoId / audioId



            videoId 获取方法:

            - body_html 中 <div class="ne-video"/> 结构里 data-video-src 属性



            audioId 获取方法:

            - body_html 中 <div class="ne-audio"/> 结构里 data-audio-src 属性



            注意:

            - 只支持普通文档内的视频、音频

            - 如 body_html 中未找到 data-video-src / data-audio-src
            属性，请在前台编辑更新文档，以触发重新编译
          required: true
          deprecated: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - success
                      - transcoding
                      - failed
                    description: |+
                      状态
                      (success:转码成功, transcoding:转码中, failed:转码失败)

                  url:
                    type: string
                    description: |+
                      音频/视频播放地址


                      - 有效期 2 小时

        '400': *ref_0
        '401': *ref_1
        '403': *ref_2
        '404': *ref_3
        '422': *ref_4
        '429': *ref_5
        '500': *ref_6
