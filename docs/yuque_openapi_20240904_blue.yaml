        body_sheet:
          type: string
          description: |+

            表格正文内容


            用本字段读取表格内容, 在文档为表格 (sheet) 类型时会返回。


            语雀表格 (sheet) 正文格式示例如下, JSON 反序列化后的结构:
            (注意: 所有项的值均为字符串, 公式项为计算后的值, 日期格式: yyyy-mm-dd HH:MM:SS)


            ```json
            {
              "version": "1.0",
              "data": [
                {
                  "name": "Sheet1",
                  "index": 0,
                  "rowCount": 100,
                  "colCount": 4,
                  "table": [
                    ["参数名", "类型", "必填", "默认值"],
                    ["name", "string", "1", ""],
                    ["flag", "boolean", "0", "false"]
                  ]
                },
                {
                  "name": "Sheet2",
                  "index": 0,
                  "rowCount": 100,
                  "colCount": 8,
                  "table": []
                }
              ]
            }
            ```

        body_table:
          type: string
          description: |-

            数据表正文内容, 用本字段读取数据表内容, 在文档为数据表 (Table) 类型时会返回。


            ```json
            {
            totalCount: 1000, // 总行数
            records: [{
              {
            // values为数组，顺序按meta中的columns顺序排列
            values:[{
            // 复选框，值为true/false
            "value": "true"
            },{
            // 多选框，对应选中的options
            "value": [
            "AUb7o2",
            "rkGdKP"
            ]
            },{
            // 评分：0-5
            "value": "4"
            }, {
            // 进度：0-100
            "value": "34"
            }, {
            // 文件
            "value": [
            {
            "name": "emails.csv",
            "uid": "rc-upload-1722830344900-3",
            "src": "https://host/xx.csv",
            "size": 148,
            "fileKey": "sheet"
            }
            ]
            }, {
            "value": "文本"
            }, {
            // 单选
            "value": "waiting"
            }, {
            // 日期
            "value": {
            "seconds": 3932799476,
            "text": "2024-08-14",
            "time": "2024-08-14T04:12:13.318Z"
            }
            }, {
            // 用户
            "value": [
            {
            "id": 1,
            "name": "txy",
            "login": "u1",
            "avatar_url": "https://host/xx_url",
            "work_id": "",
            "description": null
            }
            ]
            }, {
            // 图片
            "value": [
            {
            "name": "test.png",
            "uid": "rc-upload-1722831237360-3",
            "src": "https://host/xx.png",
            "size": 19154,
            "width": 90,
            "height": 88
            }
            ]
            }],
            "createdAt": "2024-08-02T10:14:13.368Z",
            "updatedAt": "2024-08-05T11:56:01.102Z",
            }
             }],
             pageSize: 100,
             page: 1,
            }
            ```
