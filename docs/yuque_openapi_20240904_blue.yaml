        - name: page
          in: query
          description: 页码
          required: false
          deprecated: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: 分页数量
          required: false
          deprecated: false
          schema:
            type: integer
            maximum: 20
            default: 10
        - name: sortField
          in: query
          description: 排序字段
          required: false
          deprecated: false
          schema:
            type: string
            enum:
              - content_updated_at
              - word_count
              - read_count
              - like_count
              - comment_count
              - created_at
        - name: sortOrder
          in: query
          description: 排序方向
          required: false
          deprecated: false
          schema:
            type: string
            enum:
              - desc
              - asc
            default: desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      docs:
                        $ref: '#/components/schemas/V2DocStatistics'
                      total:
                        type: integer
                        description: 总数量
        '400': *ref_0
        '401': *ref_1
        '403': *ref_2
        '404': *ref_3
        '422': *ref_4
        '429': *ref_5
        '500': *ref_6
