security:
  - authToken: []
paths:
  /api/v2/hello:
    get:
      tags:
        - user
      summary: 心跳
      operationId: user_api_v2_hello
      description: |-
        心跳
        GET /api/v2/hello
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        description: 欢迎消息
        '400': &ref_0
          $ref: '#/components/responses/400'
        '401': &ref_1
          $ref: '#/components/responses/401'
        '403': &ref_2
          $ref: '#/components/responses/403'
        '404': &ref_3
          $ref: '#/components/responses/404'
        '422': &ref_4
          $ref: '#/components/responses/422'
        '429': &ref_5
          $ref: '#/components/responses/429'
        '500': &ref_6
          $ref: '#/components/responses/500'
  /api/v2/user:
    get:
      tags:
        - user
      summary: 获取当前 Token 的用户详情
      operationId: user_api_v2_user_info
      description: |+
        获取当前 Token 的用户详情
        GET /api/v2/user

      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/V2User'
        '400': *ref_0
        '401': *ref_1
        '403': *ref_2
        '404': *ref_3
        '422': *ref_4
        '429': *ref_5
        '500': *ref_6
  /api/v2/search:
    get:
      tags:
        - search
      summary: 通用搜索
      operationId: search_api_v2_search
      description: |+
        通用搜索
        GET /api/v2/search


        - 支持分页, PageSize 固定为 20

      parameters:
        - name: q
          in: query
          description: 搜索关键词
          required: true
          deprecated: false
          schema:
            type: string
            maxLength: 200
        - name: type
          in: query
          description: |-
            搜索类型
            (doc:文档, repo:知识库)
          required: true
          deprecated: false
          schema:
            type: string
            enum:
              - doc
              - repo
        - name: scope
          in: query
          description: |-
            搜索范围, 不填默认为搜索当前用户/团队


            [例子]
            ```
            - 假设:
              - 团队 URL = https://yuque_domain/group_a
              - 知识库 URL = https://yuque_domain/group_a/book_x
            - 则:
              - 搜索团队里的文档: { type: 'doc', scope: 'group_a' }
              - 搜索团队里的知识库: { type: 'repo', scope: 'group_a' }
              - 搜索知识库里的文档: { type: 'doc', scope: 'group_a/book_x' }
            ```
          required: false
          deprecated: false
          schema:
            type: string
            maxLength: 400
        - name: page
          in: query
          description: 页码 [分页参数]
          required: false
          deprecated: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: 页码, 非偏移量 [分页参数]
          required: false
          deprecated: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: creatorId
          in: query
          description: 仅搜索指定作者 ID [筛选条件]
          required: false
          deprecated: true
          schema:
            type: integer
        - name: creator
          in: query
          description: 仅搜索指定作者 login [筛选条件]
          required: false
          deprecated: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: 结果总量
                      pageNo:
                        type: integer
                        description: 页码
                      pageSize:
                        type: integer
                        description: 每页数量
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/V2SearchResult'
        '400': *ref_0
        '401': *ref_1
        '403': *ref_2
        '404': *ref_3
        '422': *ref_4
        '429': *ref_5
        '500': *ref_6
  /api/v2/users/{id}/groups:
    get:
      tags:
        - group
      summary: 获取用户的团队
      operationId: group_api_v2_user_group_list
      description: |+
        获取用户的团队
        GET /api/v2/users/:id/groups


        - 支持分页, PageSize 固定为 100

      parameters:
        - name: id
          in: path
          description: 用户 login 或 ID
          required: true
          deprecated: false
          schema:
            type: string
        - name: role
          in: query
          description: |-
            角色 [过滤条件]
            (0:管理员, 1:成员)
          required: false
          deprecated: false
          schema:
            type: integer
            enum:
              - 0
              - 1
        - name: offset
          in: query
          description: 偏移量 [分页条件]
          required: false
          deprecated: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/V2Group'
        '400': *ref_0
        '401': *ref_1
        '403': *ref_2
        '404': *ref_3
        '422': *ref_4
        '429': *ref_5
        '500': *ref_6
  /api/v2/groups/{login}/users:
    get:
      tags:
        - group
      summary: 获取团队的成员
      operationId: group_api_v2_group_member_list
      description: |+
        获取团队的成员
        GET /api/v2/groups/:login/users


        - 支持分页, PageSize 固定为 100

      parameters:
        - name: login
          in: path
          description: 团队 Login or ID
          required: true
          deprecated: false
          schema:
            type: string
        - name: role
          in: query
          description: |-
            角色 [筛选条件]
            (0:管理员, 1:成员, 2:只读成员)
          required: false
          deprecated: false
          schema:
            type: integer
            enum:
              - 0
              - 1
              - 2
        - name: offset
          in: query
          description: 偏移量 [分页条件]
          required: false
          deprecated: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/V2GroupUser'
        '400': *ref_0
        '401': *ref_1
        '403': *ref_2
        '404': *ref_3
        '422': *ref_4
        '429': *ref_5
        '500': *ref_6
  /api/v2/groups/{login}/users/{id}:
    put:
      tags:
        - group
      summary: 变更成员
      operationId: group_api_v2_group_member_update
      description: |+
        变更成员
        PUT /api/v2/groups/:login/users/:id

      parameters:
        - name: login
          in: path
          description: 团队 Login or ID
          required: true
          deprecated: false
          schema:
            type: string
        - name: id
          in: path
          description: 用户 Login or ID
          required: true
          deprecated: false
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/ApiV2GroupMemberUpdatePut'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/V2GroupUser'
        '400': *ref_0
        '401': *ref_1
        '403': *ref_2
        '404': *ref_3
        '422': *ref_4
        '429': *ref_5
        '500': *ref_6
    delete:
      tags:
        - group
      summary: 删除成员
      operationId: group_api_v2_group_member_destroy
      description: |-
        删除成员
        DELETE /api/v2/groups/:login/users/:id
      parameters:
        - name: login
          in: path
          description: 团队 Login or ID
          required: true
          deprecated: false
          schema:
            type: string
        - name: id
          in: path
          description: 用户 Login or ID
          required: true
          deprecated: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                        description: 删除用户 ID
        '400': *ref_0
        '401': *ref_1
        '403': *ref_2
        '404': *ref_3
        '422': *ref_4
        '429': *ref_5
        '500': *ref_6
  /api/v2/repos/{book_id}/docs:
    get:
      tags:
        - doc
      summary: 获取知识库的文档列表
      operationId: doc_api_v2_doc_list-by_id
      description: |+
