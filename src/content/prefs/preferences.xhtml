<linkset>
  <html:link rel="localization" href="notero.ftl" />
</linkset>

<!-- The `notero` variable used below is defined in `scripts/build.ts` -->
<groupbox>
  <label>
    <html:h2 data-l10n-id="notero-preferences-yuque-groupbox-heading" />
  </label>
  <label data-l10n-id="notero-preferences-yuque-groupbox-description">
    <label
      data-l10n-name="notero-preferences-readme"
      is="zotero-text-link"
      href="https://github.com/dvanoni/notero#readme"
    />
  </label>
  <separator class="thin" />
  <hbox align="center">
    <label
      control="notero-yuqueBaseUrl"
      data-l10n-id="notero-preferences-yuque-base-url"
    />
    <html:input
      id="notero-yuqueBaseUrl"
      preference="extensions.notero.yuqueBaseUrl"
      type="text"
    />
  </hbox>
  <hbox align="center">
    <label
      control="notero-yuqueGroupLogin"
      data-l10n-id="notero-preferences-yuque-group-login"
    />
    <html:input
      id="notero-yuqueGroupLogin"
      preference="extensions.notero.yuqueGroupLogin"
      type="text"
    />
  </hbox>
  <hbox align="center">
    <label
      control="notero-yuqueBookSlug"
      data-l10n-id="notero-preferences-yuque-book-slug"
    />
    <html:input
      id="notero-yuqueBookSlug"
      preference="extensions.notero.yuqueBookSlug"
      type="text"
    />
  </hbox>
  <hbox align="center" id="notero-yuqueToken-container">
    <label
      control="notero-yuqueToken"
      data-l10n-id="notero-preferences-yuque-token"
    />
    <html:input
      id="notero-yuqueToken"
      preference="extensions.notero.yuqueToken"
      type="password"
    />
    <button
      data-l10n-id="notero-preferences-yuque-token-visibility"
      data-l10n-args='{"action":"reveal"}'
      id="notero-yuqueToken-visibility"
      image="chrome://zotero/skin/16/universal/view.svg"
      oncommand="notero.preferences.toggleYuqueTokenVisibility();"
    />
  </hbox>
</groupbox>

<groupbox>
  <label>
    <html:h2 data-l10n-id="notero-preferences-properties-groupbox-heading" />
  </label>
  <label data-l10n-id="notero-preferences-properties-groupbox-description" />
  <separator class="thin" />
  <hbox align="center">
    <label
      control="notero-pageTitleFormat"
      data-l10n-id="notero-preferences-page-title-format"
    />
    <menulist
      id="notero-pageTitleFormat"
      native="true"
      preference="extensions.notero.pageTitleFormat"
    >
      <menupopup>
        <menuitem value="itemAuthorDateCitation" data-l10n-id="notero-page-title-format-item-author-date-citation" />
        <menuitem value="itemCitationKey" data-l10n-id="notero-page-title-format-item-citation-key" />
        <menuitem value="itemFullCitation" data-l10n-id="notero-page-title-format-item-full-citation" />
        <menuitem value="itemInTextCitation" data-l10n-id="notero-page-title-format-item-in-text-citation" />
        <menuitem value="itemShortTitle" data-l10n-id="notero-page-title-format-item-short-title" />
        <menuitem value="itemTitle" data-l10n-id="notero-page-title-format-item-title" />
      </menupopup>
    </menulist>
  </hbox>
</groupbox>

<groupbox>
  <label>
    <html:h2 data-l10n-id="notero-preferences-sync-groupbox-heading" />
  </label>
  <label data-l10n-id="notero-preferences-sync-groupbox-description1" />
  <label data-l10n-id="notero-preferences-sync-groupbox-description2" />
  <separator class="thin" />
  <hbox class="virtualized-table-container" flex="1">
    <html:div id="notero-syncConfigsTable-container" />
  </hbox>
  <separator class="thin" />
  <checkbox
    data-l10n-id="notero-preferences-sync-on-modify-items"
    id="notero-syncOnModifyItems"
    native="true"
    preference="extensions.notero.syncOnModifyItems"
  />
  <checkbox
    data-l10n-id="notero-preferences-sync-notes"
    id="notero-syncNotes"
    native="true"
    preference="extensions.notero.syncNotes"
  />
</groupbox>
